name: CI/CD → DigitalOcean

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: /opt/inpilot

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Lint, type-check & unit tests
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test
        env:
          MONGODB_URI: mongodb://localhost:27017/ci_test
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Build & push Docker image    (master push only)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push (linux/amd64 for DigitalOcean)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to DigitalOcean Droplet   (master push only)
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: production

    steps:
      # Copy updated docker-compose + nginx config to the droplet
      - uses: actions/checkout@v4

      - name: Sync compose & nginx to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "${{ env.APP_DIR }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # ── Authenticate & pull new image ─────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # ── Guard: .env.production must exist on droplet ──────
            if [ ! -f .env.production ]; then
              echo "ERROR: /opt/inpilot/.env.production missing on droplet. Aborting."
              exit 1
            fi

            # ── Rolling update (only restarts app, nginx stays up) ─
            docker compose up -d --no-deps --remove-orphans app
            docker compose up -d nginx certbot

            # ── Wait for healthy status (max 2 min) ───────────────
            echo "Waiting for container to become healthy…"
            for i in $(seq 1 24); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' linkedboost-app 2>/dev/null || echo "starting")
              echo "  [${i}/24] status: $HEALTH"
              [ "$HEALTH" = "healthy" ] && { echo "Healthy!"; break; }
              if [ "$i" -eq 24 ]; then
                echo "FAILED – printing last 50 log lines:"
                docker compose logs --tail=50 app
                exit 1
              fi
              sleep 5
            done

            # ── Prune old images to save disk space ───────────────
            docker image prune -f

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment ${{ job.status == 'success' && '✅ succeeded' || '❌ failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ needs.build.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${{ secrets.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
