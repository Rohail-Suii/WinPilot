# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Mirrors the settings of the existing winpilot service. Secrets are marked
# sync:false so Render prompts for them instead of storing them in git.
#
# Note: Next.js and Socket.IO share ONE port (Render injects $PORT), because
# Render routes traffic to a single port per service. `npm start` boots
# server.ts, which mounts Socket.IO on the Next.js server at path /api/ws.
services:
  - type: web
    name: winpilot
    runtime: node
    plan: starter
    region: oregon
    branch: master
    # devDependencies are required to build (typescript, tailwindcss,
    # @tailwindcss/postcss, @types/*). NODE_ENV=production would normally make
    # npm skip them; the repo's .npmrc (include=dev) prevents that, so a plain
    # npm install is enough here.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: https://winpilot.onrender.com
      - key: AUTH_TRUST_HOST
        value: "true"
      # Must be present at BUILD time — it is inlined into the client bundle.
      - key: NEXT_PUBLIC_WS_URL
        value: https://winpilot.onrender.com
      - key: WS_ALLOWED_ORIGINS
        value: https://winpilot.onrender.com,https://www.linkedin.com
      - key: CORS_ORIGIN
        value: https://www.linkedin.com
      - key: OPENROUTER_HTTP_REFERER
        value: https://winpilot.onrender.com
      - key: OPENROUTER_APP_TITLE
        value: WinPilot
      - key: ENFORCE_DAILY_LIMITS
        value: "true"
      # ── Secrets: set these in the Render dashboard ──
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
